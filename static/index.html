<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orbit Visualiser</title>
<style>
  :root {
    --bg:#0b0f14; --panel:#121821; --line:#1e2836; --text:#d7e0ea; --muted:#7d8b9c;
    --accent:#4fd1c5; --visible:#7ee787; --hidden:#3a4a5e; --site:#f0883e;
    --site2:#d2a8ff; --track:#2b6d7a; --warn:#f85149; --ok:#7ee787;
    --l0:#7ee787; --l1:#79c0ff; --l2:#d2a8ff; --l3:#ffa657;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;padding:16px;background:var(--bg);color:var(--text);
       font-family:var(--mono);font-size:13px}
  header{display:flex;align-items:baseline;gap:16px;flex-wrap:wrap;margin-bottom:12px}
  h1{font-size:15px;margin:0;letter-spacing:.08em;text-transform:uppercase}
  h1 span{color:var(--accent)}
  .stat{color:var(--muted)} .stat b{color:var(--text);font-weight:600}
  #link{color:var(--warn)} #link.up{color:var(--ok)}

  .controls{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
  select{background:var(--panel);color:var(--text);border:1px solid var(--line);
         border-radius:4px;padding:5px 8px;font-family:var(--mono);font-size:12px}
  select:focus{outline:1px solid var(--accent)}
  label{color:var(--muted);font-size:11px;letter-spacing:.08em;text-transform:uppercase;
        margin-right:6px}
  .badge{padding:2px 7px;border-radius:3px;font-size:10px;letter-spacing:.06em;
         text-transform:uppercase;border:1px solid var(--line);color:var(--muted)}
  .badge.warn{color:var(--site);border-color:var(--site)}

  .grid{display:grid;grid-template-columns:1fr 340px;gap:14px;align-items:start}
  @media (max-width:1050px){.grid{grid-template-columns:1fr}}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:11px}
  .panel h2{font-size:10px;margin:0 0 9px;color:var(--muted);letter-spacing:.12em;
            text-transform:uppercase;font-weight:600}
  svg{display:block;width:100%;height:auto}

  .graticule{stroke:var(--line);stroke-width:.5;fill:none}
  .coast{stroke:#2c3a4d;stroke-width:.6;fill:#161e29}
  .farside{fill:#0a0e13;stroke:none}
  .frame{stroke:var(--line);stroke-width:1;fill:none}
  .track{fill:none;stroke-width:.8;opacity:.45}
  .ring{stroke:var(--line);stroke-width:.7;fill:none}
  .ringlabel{fill:var(--muted);font-size:7px}
  .cardinal{font-size:9px;fill:var(--text)}
  .sitelabel{fill:var(--site);font-size:7px}

  .dop{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:8px}
  .dop div{color:var(--muted)} .dop b{color:var(--text)}
  .dop b.bad{color:var(--warn)} .dop b.good{color:var(--ok)}

  table{width:100%;border-collapse:collapse}
  th,td{text-align:right;padding:3px 5px}
  th:first-child,td:first-child{text-align:left}
  th{color:var(--muted);font-weight:600;border-bottom:1px solid var(--line);
     font-size:10px;letter-spacing:.06em;text-transform:uppercase}
  td{border-bottom:1px solid #161d27;font-size:12px}
  tbody tr:hover{background:#16202c}
  .swatch{display:inline-block;width:7px;height:7px;border-radius:2px;margin-right:5px}
  .empty{color:var(--muted);padding:9px 4px}
  footer{margin-top:12px;color:var(--muted);font-size:11px;line-height:1.6}
  .note{color:var(--site)}
</style>
</head>
<body>

<header>
  <h1>Orbit <span>Visualiser</span></h1>
  <div class="stat">link <b id="link">connecting</b></div>
  <div class="stat">utc <b id="utc">&mdash;</b></div>
  <div class="stat">age <b id="age">&mdash;</b></div>
  <div class="stat">tracked <b id="count">&mdash;</b></div>
  <div class="stat">visible <b id="nvis">&mdash;</b></div>
  <span id="verbadge"></span>
</header>

<div class="controls">
  <div><label for="scenario">Constellation</label><select id="scenario"></select></div>
  <div><label for="site">Observer</label><select id="site"></select></div>
</div>

<div class="grid">
  <div class="panel">
    <h2 id="maptitle">Ground tracks &middot; equirectangular</h2>
    <svg id="map" viewBox="0 0 720 360" preserveAspectRatio="xMidYMid meet">
      <rect x="0" y="0" width="720" height="360" fill="#0e141c"/>
      <g id="farside"></g>
      <g id="coast"></g>
      <g id="grat"></g>
      <g id="tracks"></g>
      <g id="sats"></g>
      <g id="sitemarks"></g>
      <rect class="frame" x="0" y="0" width="720" height="360"/>
    </svg>
    <div id="legend" style="margin-top:8px;color:var(--muted);font-size:11px"></div>
  </div>

  <div>
    <div class="panel">
      <h2>Sky view &middot; az / el from observer</h2>
      <svg id="sky" viewBox="-118 -118 236 236" preserveAspectRatio="xMidYMid meet">
        <g id="rings"></g><g id="skysats"></g>
      </svg>
    </div>

    <div class="panel" style="margin-top:14px">
      <h2>Geometry &middot; live</h2>
      <div class="dop">
        <div>n vis <b id="dn">&mdash;</b></div>
        <div>GDOP <b id="dg">&mdash;</b></div>
        <div>PDOP <b id="dp">&mdash;</b></div>
      </div>
      <table>
        <thead><tr><th>Satellite</th><th>El</th><th>Az</th><th>Range km</th></tr></thead>
        <tbody id="vistable"></tbody>
      </table>
      <div id="visempty" class="empty">waiting for data&hellip;</div>
    </div>
  </div>
</div>

<footer id="foot">&mdash;</footer>

<script>
const MAP_W=720, MAP_H=360, SKY_R=100;
const projX = lon => (lon+180)*(MAP_W/360);
const projY = lat => (90-lat)*(MAP_H/180);
const skyXY = (az,el) => { const r=(90-el)/90*SKY_R, a=az*Math.PI/180;
                           return [r*Math.sin(a), -r*Math.cos(a)]; };
const NS="http://www.w3.org/2000/svg";
const el=(t,a)=>{const n=document.createElementNS(NS,t);for(const k in a)n.setAttribute(k,a[k]);return n;};
const txt=(t,a,s)=>{const n=el(t,a);n.textContent=s;return n;};
const LCOL=["var(--l0)","var(--l1)","var(--l2)","var(--l3)"];

let catalog=[], current=null, state=null, tracksMsg=null;
let activeScenario=null, activeSite=null, mask=10, layerColor={};
let lastUpdate=null, coastDrawn=false;

// ---------- static furniture ----------
(function grat(){
  const g=document.getElementById("grat");
  for(let lon=-180;lon<=180;lon+=30)
    g.appendChild(el("line",{class:"graticule",x1:projX(lon),y1:0,x2:projX(lon),y2:MAP_H}));
  for(let lat=-60;lat<=60;lat+=30)
    g.appendChild(el("line",{class:"graticule",x1:0,y1:projY(lat),x2:MAP_W,y2:projY(lat)}));
  g.appendChild(el("line",{class:"graticule",x1:0,y1:projY(0),x2:MAP_W,y2:projY(0),"stroke-width":.9}));
})();

function drawSkyRings(){
  const g=document.getElementById("rings"); g.replaceChildren();
  [0,30,60].forEach(e=>{
    const r=(90-e)/90*SKY_R;
    g.appendChild(el("circle",{class:"ring",cx:0,cy:0,r:r}));
    g.appendChild(txt("text",{class:"ringlabel",x:3,y:-r-2},e+"\u00B0"));
  });
  const rm=(90-mask)/90*SKY_R;
  g.appendChild(el("circle",{class:"ring",cx:0,cy:0,r:rm,stroke:"var(--site)",
                             "stroke-dasharray":"2 3",opacity:.6}));
  [["N",0],["E",90],["S",180],["W",270]].forEach(([lab,az])=>{
    const [x,y]=skyXY(az,-6);
    g.appendChild(txt("text",{class:"cardinal",x:x,y:y,"text-anchor":"middle",
                              "dominant-baseline":"central"},lab));
  });
}
drawSkyRings();

// Earth coastlines, served locally. Cosmetic: absence degrades to graticule only.
async function loadCoast(){
  if(coastDrawn) return;
  try{
    const res=await fetch("/static/land-110m.json");
    const topo=await res.json(), obj=topo.objects.land, arcs=topo.arcs, tr=topo.transform;
    const decode=arc=>{let x=0,y=0;return arc.map(([dx,dy])=>{x+=dx;y+=dy;
      return [x*tr.scale[0]+tr.translate[0], y*tr.scale[1]+tr.translate[1]];});};
    const ring=idxs=>idxs.flatMap(i=>{const p=decode(arcs[i<0?~i:i]);
      return i<0?p.slice().reverse():p;});
    const g=document.getElementById("coast");
    const geoms=obj.type==="GeometryCollection"?obj.geometries:[obj];
    geoms.forEach(gm=>{
      const polys=gm.type==="MultiPolygon"?gm.arcs:[gm.arcs];
      polys.forEach(poly=>poly.forEach(r=>{
        g.appendChild(el("polygon",{class:"coast",
          points:ring(r).map(([lo,la])=>projX(lo)+","+projY(la)).join(" ")}));
      }));
    });
    coastDrawn=true;
  }catch(e){console.warn("coastlines unavailable",e);}
}

function setBodyChrome(body){
  const coast=document.getElementById("coast"), fs=document.getElementById("farside");
  if(body==="Earth"){
    fs.replaceChildren(); coast.style.display=""; loadCoast();
    document.getElementById("maptitle").textContent="Ground tracks - equirectangular";
  }else{
    coast.style.display="none"; fs.replaceChildren();
    // Shade the lunar far side (|lon| > 90): meaningful for comms and coverage.
    fs.appendChild(el("rect",{class:"farside",x:0,y:0,width:projX(-90),height:MAP_H}));
    fs.appendChild(el("rect",{class:"farside",x:projX(90),y:0,
                              width:MAP_W-projX(90),height:MAP_H}));
    fs.appendChild(txt("text",{x:projX(-135),y:18,fill:"var(--muted)","font-size":8,
                               "text-anchor":"middle"},"far side"));
    fs.appendChild(txt("text",{x:projX(135),y:18,fill:"var(--muted)","font-size":8,
                               "text-anchor":"middle"},"far side"));
    document.getElementById("maptitle").textContent=
      "Selenographic ground tracks - equirectangular";
  }
}

// ---------- rendering ----------
function colorFor(layer){
  if(!layer) return "var(--visible)";
  if(!(layer in layerColor)){
    layerColor[layer]=LCOL[Object.keys(layerColor).length % LCOL.length];
  }
  return layerColor[layer];
}

function renderTracks(){
  const g=document.getElementById("tracks"); g.replaceChildren();
  if(!tracksMsg||tracksMsg.scenario!==activeScenario) return;
  tracksMsg.tracks.forEach(t=>{
    let seg=[], prev=null;
    const flush=()=>{ if(seg.length>1)
      g.appendChild(el("polyline",{class:"track",stroke:colorFor(t.layer),
                                   points:seg.join(" ")})); seg=[]; };
    t.points.forEach(([lat,lon])=>{
      if(prev!==null && Math.abs(lon-prev)>180) flush();
      seg.push(projX(lon)+","+projY(lat)); prev=lon;
    });
    flush();
  });
}

function renderState(){
  if(!state||state.scenario!==activeScenario) return;
  mask=state.elevation_mask_deg; drawSkyRings();
  const site=activeSite;
  const sats=state.satellites;

  // map: subpoints
  const g=document.getElementById("sats"); g.replaceChildren();
  sats.forEach(s=>{
    const v=s.sites[site] && s.sites[site].visible;
    g.appendChild(el("circle",{cx:projX(s.lon_deg),cy:projY(s.lat_deg),r:v?3:2,
      fill:v?colorFor(s.layer):"var(--hidden)"}));
  });

  // map: every site marked, active one highlighted
  const sm=document.getElementById("sitemarks"); sm.replaceChildren();
  state.sites.forEach(st=>{
    const x=projX(st.lon_deg), y=projY(st.lat_deg);
    const on=st.name===site, c=on?"var(--site)":"var(--site2)";
    sm.appendChild(el("path",{d:`M${x-5},${y} L${x+5},${y} M${x},${y-5} L${x},${y+5}`,
                              stroke:c,"stroke-width":on?1.4:1,opacity:on?1:.65}));
    sm.appendChild(el("circle",{cx:x,cy:y,r:on?4:3,fill:"none",stroke:c,
                                "stroke-width":on?1.4:1,opacity:on?1:.65}));
    sm.appendChild(txt("text",{class:"sitelabel",x:x+7,y:y-5,fill:c,
                               opacity:on?1:.7},st.name));
  });

  // sky plot
  const sk=document.getElementById("skysats"); sk.replaceChildren();
  sats.forEach(s=>{
    const d=s.sites[site]; if(!d||d.el_deg<=0) return;
    const [x,y]=skyXY(d.az_deg,d.el_deg);
    sk.appendChild(el("circle",{cx:x,cy:y,r:d.visible?3.5:2.2,
      fill:d.visible?colorFor(s.layer):"var(--hidden)"}));
  });

  // DOP
  const dop=(state.dop||{})[site]||{};
  const gEl=document.getElementById("dg"), pEl=document.getElementById("dp");
  document.getElementById("dn").textContent=dop.n_visible ?? "-";
  gEl.textContent=dop.gdop ?? "-"; pEl.textContent=dop.pdop ?? "-";
  gEl.className=dop.gdop==null?"":(dop.gdop<=6?"good":"bad");
  pEl.className=dop.pdop==null?"":(dop.pdop<=4?"good":"bad");

  // table
  const vis=sats.filter(s=>s.sites[site]&&s.sites[site].visible)
                .sort((a,b)=>b.sites[site].el_deg-a.sites[site].el_deg);
  const tb=document.getElementById("vistable"); tb.replaceChildren();
  vis.forEach(s=>{
    const d=s.sites[site], tr=document.createElement("tr");
    const td0=document.createElement("td");
    const sw=document.createElement("span");
    sw.className="swatch"; sw.style.background=colorFor(s.layer);
    td0.appendChild(sw); td0.appendChild(document.createTextNode(shortName(s.name)));
    tr.appendChild(td0);
    [d.el_deg.toFixed(2),d.az_deg.toFixed(2),d.range_km.toFixed(0)].forEach(v=>{
      const td=document.createElement("td"); td.textContent=v; tr.appendChild(td);
    });
    tb.appendChild(tr);
  });
  const empty=document.getElementById("visempty");
  empty.style.display=vis.length?"none":"block";
  if(!vis.length) empty.textContent="no satellites above the "+mask+"\u00B0 mask";

  // header + legend + footer
  document.getElementById("utc").textContent=state.updated_utc.slice(11,19)+"Z";
  document.getElementById("count").textContent=state.satellite_count;
  document.getElementById("nvis").textContent=vis.length;
  lastUpdate=new Date(state.updated_utc);

  const layers=[...new Set(sats.map(s=>s.layer).filter(Boolean))];
  document.getElementById("legend").innerHTML = layers.length
    ? layers.map(l=>`<span class="swatch" style="background:${colorFor(l)}"></span>${l}`)
            .join("&nbsp;&nbsp;&nbsp;")
    : "";

  const meta=catalog.find(c=>c.id===activeScenario)||{};
  const cov=meta.coverage&&meta.coverage[site];
  document.getElementById("foot").innerHTML =
    `${state.body} &middot; ${state.frame} &middot; mask ${mask}\u00B0 &middot; ` +
    `observer ${site} (${(state.sites.find(s=>s.name===site)||{}).lat_deg}\u00B0, ` +
    `${(state.sites.find(s=>s.name===site)||{}).lon_deg}\u00B0)` +
    (tracksMsg&&tracksMsg.scenario===activeScenario
       ? ` &middot; track window ${tracksMsg.window_hours} hr` : "") +
    (cov!==undefined
       ? `<br>study availability at this site: ${cov}%` : "") +
    (meta.note?`<br><span class="note">${meta.note}</span>`:"");
}

function shortName(n){
  const m=n.match(/PRN\s*\d+/); if(m) return n.trim();
  return n.replace(/^OPT-[BD]_/,"").replace(/^[A-Z-]+\d*_/,"");
}

// ---------- controls ----------
function buildScenarioSelect(){
  const sel=document.getElementById("scenario"); sel.replaceChildren();
  const groups={};
  catalog.forEach(c=>{ (groups[c.group]=groups[c.group]||[]).push(c); });
  Object.entries(groups).forEach(([gname,items])=>{
    const og=document.createElement("optgroup"); og.label=gname;
    items.forEach(c=>{
      const o=document.createElement("option");
      o.value=c.id; o.textContent=c.label+(c.verified?"":"  [unverified]");
      og.appendChild(o);
    });
    sel.appendChild(og);
  });
  sel.value=activeScenario;
}

function buildSiteSelect(){
  const sel=document.getElementById("site"); sel.replaceChildren();
  const meta=catalog.find(c=>c.id===activeScenario);
  if(!meta) return;
  meta.sites.forEach(s=>{
    const o=document.createElement("option"); o.value=s.name; o.textContent=s.name;
    sel.appendChild(o);
  });
  if(!meta.sites.some(s=>s.name===activeSite)) activeSite=meta.sites[0].name;
  sel.value=activeSite;
  const meta2=catalog.find(c=>c.id===activeScenario);
  const b=document.getElementById("verbadge");
  b.innerHTML = meta2 && !meta2.verified
    ? '<span class="badge warn">unverified parameters</span>' : "";
}

document.getElementById("scenario").addEventListener("change",e=>{
  activeScenario=e.target.value; state=null; tracksMsg=null; layerColor={};
  document.getElementById("tracks").replaceChildren();
  document.getElementById("sats").replaceChildren();
  document.getElementById("skysats").replaceChildren();
  const meta=catalog.find(c=>c.id===activeScenario);
  if(meta) setBodyChrome(meta.body);
  buildSiteSelect();
  ws && ws.readyState===1 && ws.send(JSON.stringify({type:"subscribe",scenario:activeScenario}));
});

document.getElementById("site").addEventListener("change",e=>{
  activeSite=e.target.value; renderState();   // no server round trip needed
});

// ---------- websocket ----------
let ws=null, retry=1000;
function connect(){
  const proto=location.protocol==="https:"?"wss":"ws";
  ws=new WebSocket(`${proto}://${location.host}/ws`);
  ws.onopen=()=>{ retry=1000;
    const l=document.getElementById("link"); l.textContent="up"; l.classList.add("up");
    if(activeScenario) ws.send(JSON.stringify({type:"subscribe",scenario:activeScenario}));
  };
  ws.onmessage=ev=>{
    const m=JSON.parse(ev.data);
    if(m.type==="catalog"){
      catalog=m.scenarios;
      if(!activeScenario) activeScenario=m.default;
      buildScenarioSelect(); buildSiteSelect();
      const meta=catalog.find(c=>c.id===activeScenario);
      if(meta) setBodyChrome(meta.body);
    }
    if(m.type==="state"  && m.scenario===activeScenario){ state=m; renderState(); }
    if(m.type==="tracks" && m.scenario===activeScenario){ tracksMsg=m; renderTracks(); }
  };
  ws.onclose=()=>{
    const l=document.getElementById("link"); l.textContent="down"; l.classList.remove("up");
    setTimeout(connect,retry); retry=Math.min(retry*2,15000);
  };
  ws.onerror=()=>ws.close();
}
connect();

// Age ticks client-side: if the socket stays open but propagation stalls,
// a server-reported age would freeze while this keeps climbing.
setInterval(()=>{
  if(!lastUpdate) return;
  document.getElementById("age").textContent=
    ((Date.now()-lastUpdate.getTime())/1000).toFixed(1)+"s";
},200);
</script>
</body>
</html>
