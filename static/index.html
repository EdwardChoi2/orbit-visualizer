<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orbit Visualiser &middot; GPS Constellation</title>
<style>
  :root {
    --bg:        #0b0f14;
    --panel:     #121821;
    --line:      #1e2836;
    --text:      #d7e0ea;
    --muted:     #7d8b9c;
    --accent:    #4fd1c5;
    --visible:   #7ee787;
    --hidden:    #3a4a5e;
    --site:      #f0883e;
    --track:     #2b6d7a;
    --warn:      #f85149;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 18px;
    background: var(--bg); color: var(--text);
    font-family: var(--mono); font-size: 13px;
  }
  header {
    display: flex; align-items: baseline; gap: 18px;
    flex-wrap: wrap; margin-bottom: 16px;
  }
  h1 { font-size: 16px; margin: 0; letter-spacing: .08em; text-transform: uppercase; }
  h1 span { color: var(--accent); }
  .stat { color: var(--muted); }
  .stat b { color: var(--text); font-weight: 600; }
  #link { color: var(--warn); }
  #link.up { color: var(--visible); }

  .grid { display: grid; grid-template-columns: 1fr 340px; gap: 16px; align-items: start; }
  @media (max-width: 1000px) { .grid { grid-template-columns: 1fr; } }

  .panel {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 6px; padding: 12px;
  }
  .panel h2 {
    font-size: 11px; margin: 0 0 10px; color: var(--muted);
    letter-spacing: .12em; text-transform: uppercase; font-weight: 600;
  }
  svg { display: block; width: 100%; height: auto; }

  .graticule { stroke: var(--line); stroke-width: .5; fill: none; }
  .coast     { stroke: #2c3a4d; stroke-width: .6; fill: #161e29; }
  .frame     { stroke: var(--line); stroke-width: 1; fill: none; }
  .track     { stroke: var(--track); stroke-width: .8; fill: none; opacity: .55; }
  .track.vis { stroke: var(--visible); opacity: .85; }
  .ring      { stroke: var(--line); stroke-width: .7; fill: none; }
  .ringlabel, .cardinal { fill: var(--muted); font-size: 7px; }
  .cardinal  { font-size: 9px; fill: var(--text); }

  table { width: 100%; border-collapse: collapse; margin-top: 4px; }
  th, td { text-align: right; padding: 3px 5px; }
  th:first-child, td:first-child { text-align: left; }
  th { color: var(--muted); font-weight: 600; border-bottom: 1px solid var(--line); font-size: 10px;
       letter-spacing: .06em; text-transform: uppercase; }
  td { border-bottom: 1px solid #161d27; }
  tbody tr:hover { background: #16202c; }
  .empty { color: var(--muted); padding: 10px 4px; }
  footer { margin-top: 14px; color: var(--muted); font-size: 11px; }
</style>
</head>
<body>

<header>
  <h1>Orbit <span>Visualiser</span></h1>
  <div class="stat">link <b id="link">connecting</b></div>
  <div class="stat">utc <b id="utc">&mdash;</b></div>
  <div class="stat">age <b id="age">&mdash;</b></div>
  <div class="stat">tracked <b id="count">&mdash;</b></div>
  <div class="stat">visible <b id="nvis">&mdash;</b></div>
</header>

<div class="grid">
  <div class="panel">
    <h2>Ground tracks &middot; equirectangular</h2>
    <svg id="map" viewBox="0 0 720 360" preserveAspectRatio="xMidYMid meet">
      <rect x="0" y="0" width="720" height="360" fill="#0e141c"/>
      <g id="coast"></g>
      <g id="grat"></g>
      <g id="tracks"></g>
      <g id="sats"></g>
      <g id="site"></g>
      <rect class="frame" x="0" y="0" width="720" height="360"/>
    </svg>
  </div>

  <div>
    <div class="panel">
      <h2>Sky view &middot; az / el from site</h2>
      <svg id="sky" viewBox="-118 -118 236 236" preserveAspectRatio="xMidYMid meet">
        <g id="rings"></g>
        <g id="skysats"></g>
      </svg>
    </div>

    <div class="panel" style="margin-top:16px">
      <h2>Visible &middot; above mask</h2>
      <table>
        <thead><tr><th>Satellite</th><th>El</th><th>Az</th><th>Range km</th></tr></thead>
        <tbody id="vistable"></tbody>
      </table>
      <div id="visempty" class="empty">waiting for data&hellip;</div>
    </div>
  </div>
</div>

<footer id="siteinfo">&mdash;</footer>

<script>
// ---------- projection helpers ----------
// Equirectangular: longitude and latitude map linearly to x and y.
const MAP_W = 720, MAP_H = 360;
const projX = lon => (lon + 180) * (MAP_W / 360);
const projY = lat => (90 - lat) * (MAP_H / 180);

// Polar sky plot: zenith at centre, horizon at the rim.
// Radius scales with (90 - elevation), azimuth measured clockwise from north.
const SKY_R = 100;
const skyXY = (az, el) => {
  const r = (90 - el) / 90 * SKY_R;
  const a = az * Math.PI / 180;
  return [r * Math.sin(a), -r * Math.cos(a)];
};

const SVGNS = "http://www.w3.org/2000/svg";
const el = (tag, attrs) => {
  const n = document.createElementNS(SVGNS, tag);
  for (const k in attrs) n.setAttribute(k, attrs[k]);
  return n;
};

let siteLat = null, siteLon = null, mask = 10;

// ---------- static map furniture ----------
(function drawGraticule() {
  const g = document.getElementById("grat");
  for (let lon = -180; lon <= 180; lon += 30)
    g.appendChild(el("line", {class:"graticule", x1:projX(lon), y1:0, x2:projX(lon), y2:MAP_H}));
  for (let lat = -60; lat <= 60; lat += 30)
    g.appendChild(el("line", {class:"graticule", x1:0, y1:projY(lat), x2:MAP_W, y2:projY(lat)}));
  g.appendChild(el("line", {class:"graticule", x1:0, y1:projY(0), x2:MAP_W, y2:projY(0),
                            "stroke-width":.9}));
})();

(function drawSkyRings() {
  const g = document.getElementById("rings");
  [0, 30, 60].forEach(e => {
    const r = (90 - e) / 90 * SKY_R;
    g.appendChild(el("circle", {class:"ring", cx:0, cy:0, r:r}));
    g.appendChild(Object.assign(el("text", {class:"ringlabel", x:3, y:-r - 2}),
                                {textContent: e + "\u00B0"}));
  });
  // elevation mask ring, drawn dashed
  const rm = (90 - mask) / 90 * SKY_R;
  g.appendChild(el("circle", {class:"ring", cx:0, cy:0, r:rm,
                              stroke:"#f0883e", "stroke-dasharray":"2 3", opacity:.6}));
  [["N",0],["E",90],["S",180],["W",270]].forEach(([lab, az]) => {
    const [x, y] = skyXY(az, -6);
    g.appendChild(Object.assign(
      el("text", {class:"cardinal", x:x, y:y, "text-anchor":"middle", "dominant-baseline":"central"}),
      {textContent: lab}));
  });
})();

// Coastlines are cosmetic. Fetch them from a CDN, but the dashboard is fully
// functional without them -- the graticule alone is enough to read the tracks.
(async function loadCoast() {
  try {
    const res = await fetch("https://cdn.jsdelivr.net/npm/world-atlas@2/land-110m.json");
    const topo = await res.json();
    const obj = topo.objects.land;
    const arcs = topo.arcs, tr = topo.transform;
    const decode = arc => {
      let x = 0, y = 0;
      return arc.map(([dx, dy]) => {
        x += dx; y += dy;
        return [x * tr.scale[0] + tr.translate[0], y * tr.scale[1] + tr.translate[1]];
      });
    };
    const ring = idxs => idxs.flatMap(i => {
      const pts = decode(arcs[i < 0 ? ~i : i]);
      return i < 0 ? pts.slice().reverse() : pts;
    });
    const g = document.getElementById("coast");
    const polys = obj.type === "MultiPolygon" ? obj.arcs : [obj.arcs];
    polys.forEach(poly => poly.forEach(r => {
      const pts = ring(r).map(([lon, lat]) => projX(lon) + "," + projY(lat)).join(" ");
      g.appendChild(el("polygon", {class:"coast", points:pts}));
    }));
  } catch (e) {
    console.warn("coastlines unavailable, graticule only", e);
  }
})();

// ---------- rendering ----------
let visibleIds = new Set();

function renderTracks(msg) {
  const g = document.getElementById("tracks");
  g.replaceChildren();
  msg.tracks.forEach(t => {
    // Split the polyline wherever it crosses the antimeridian, otherwise the
    // line whips all the way back across the map.
    let seg = [];
    const flush = () => {
      if (seg.length > 1) {
        g.appendChild(el("polyline", {
          class: "track" + (visibleIds.has(t.norad_id) ? " vis" : ""),
          points: seg.join(" ")
        }));
      }
      seg = [];
    };
    let prevLon = null;
    t.points.forEach(([lat, lon]) => {
      if (prevLon !== null && Math.abs(lon - prevLon) > 180) flush();
      seg.push(projX(lon) + "," + projY(lat));
      prevLon = lon;
    });
    flush();
  });
}

function renderState(msg) {
  mask = msg.elevation_mask_deg ?? mask;
  siteLat = msg.site.lat_deg; siteLon = msg.site.lon_deg;

  const sats = msg.satellites.filter(s => !s.error);
  visibleIds = new Set(sats.filter(s => s.visible).map(s => s.norad_id));

  // --- map: subpoints ---
  const g = document.getElementById("sats");
  g.replaceChildren();
  sats.forEach(s => {
    g.appendChild(el("circle", {
      cx: projX(s.lon_deg), cy: projY(s.lat_deg), r: s.visible ? 3 : 2,
      fill: s.visible ? "var(--visible)" : "var(--hidden)"
    }));
  });

  // --- map: ground site ---
  const gs = document.getElementById("site");
  gs.replaceChildren();
  const sx = projX(siteLon), sy = projY(siteLat);
  gs.appendChild(el("path", {
    d: `M${sx-5},${sy} L${sx+5},${sy} M${sx},${sy-5} L${sx},${sy+5}`,
    stroke: "var(--site)", "stroke-width": 1.2
  }));
  gs.appendChild(el("circle", {cx:sx, cy:sy, r:3.5, fill:"none",
                               stroke:"var(--site)", "stroke-width":1.2}));

  // --- sky plot ---
  const sk = document.getElementById("skysats");
  sk.replaceChildren();
  sats.filter(s => s.el_deg > 0).forEach(s => {
    const [x, y] = skyXY(s.az_deg, s.el_deg);
    const up = s.el_deg > mask;
    sk.appendChild(el("circle", {cx:x, cy:y, r: up ? 3.5 : 2.2,
                                 fill: up ? "var(--visible)" : "var(--hidden)"}));
    if (up) {
      const prn = (s.name.match(/PRN\s*(\d+)/) || [,"?"])[1];
      sk.appendChild(Object.assign(
        el("text", {x:x + 5, y:y, fill:"var(--muted)", "font-size":7,
                    "dominant-baseline":"central"}),
        {textContent: prn}));
    }
  });

  // --- table ---
  const vis = sats.filter(s => s.visible).sort((a,b) => b.el_deg - a.el_deg);
  const tb = document.getElementById("vistable");
  tb.replaceChildren();
  vis.forEach(s => {
    const tr = document.createElement("tr");
    [s.name.trim(), s.el_deg.toFixed(2), s.az_deg.toFixed(2), s.range_km.toFixed(0)]
      .forEach(v => { const td = document.createElement("td"); td.textContent = v; tr.appendChild(td); });
    tb.appendChild(tr);
  });
  document.getElementById("visempty").style.display = vis.length ? "none" : "block";
  if (!vis.length) document.getElementById("visempty").textContent = "no satellites above mask";

  // --- header ---
  document.getElementById("utc").textContent = msg.updated_utc.slice(11, 19) + "Z";
  document.getElementById("count").textContent = sats.length;
  document.getElementById("nvis").textContent = vis.length;
  document.getElementById("siteinfo").textContent =
    `site ${siteLat.toFixed(5)}\u00B0, ${siteLon.toFixed(5)}\u00B0 \u00B7 ` +
    `elevation mask ${mask}\u00B0 \u00B7 propagation 2 s \u00B7 tracks 5 min`;
  lastUpdate = new Date(msg.updated_utc);
}

// ---------- websocket ----------
let lastUpdate = null, ws = null, retry = 1000;

function connect() {
  const proto = location.protocol === "https:" ? "wss" : "ws";
  ws = new WebSocket(`${proto}://${location.host}/ws`);

  ws.onopen = () => {
    retry = 1000;
    const l = document.getElementById("link");
    l.textContent = "up"; l.classList.add("up");
  };
  ws.onmessage = ev => {
    const msg = JSON.parse(ev.data);
    if (msg.type === "state")  renderState(msg);
    if (msg.type === "tracks") renderTracks(msg);
  };
  ws.onclose = () => {
    const l = document.getElementById("link");
    l.textContent = "down"; l.classList.remove("up");
    // Back off on repeated failures so a stopped server does not get hammered,
    // but reconnect quickly after a brief blip.
    setTimeout(connect, retry);
    retry = Math.min(retry * 2, 15000);
  };
  ws.onerror = () => ws.close();
}
connect();

// Snapshot age is computed client-side so it keeps ticking between pushes --
// if it climbs, the server has stopped propagating even if the socket is open.
setInterval(() => {
  if (!lastUpdate) return;
  const age = (Date.now() - lastUpdate.getTime()) / 1000;
  document.getElementById("age").textContent = age.toFixed(1) + "s";
}, 200);
</script>
</body>
</html>
